# Site passager (web) — https://docs.netlify.com/configure-builds/file-based-configuration/
# Netlify UI → Environment variables : VITE_API_URL = https://VOTRE-API.onrender.com/api
[build]
  base = "web"
  command = "bash -c 'if [ \"${VITE_API_URL:-/api}\" = \"/api\" ]; then echo \"❌ Définissez VITE_API_URL=https://xxx.onrender.com/api dans Netlify (Site configuration → Environment variables), puis redéployez.\"; exit 1; fi' && npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
